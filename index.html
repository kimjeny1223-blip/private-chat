<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FEE500" />
  <title>프라이빗 메신저 (1:1 · 단체톡 · 보이스톡)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Malgun Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
      background: #1e1f22;
      color: #222;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      width: 360px;
      background: #fee500;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    .login-box h1 {
      font-size: 20px;
      margin-bottom: 8px;
      color: #191919;
    }
    .login-box p {
      font-size: 13px;
      color: #4a4000;
      margin-bottom: 20px;
    }
    .login-box input {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #e0c800;
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
    }
    .login-box button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #3c1e1e;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .login-box button:hover { background: #261212; }
    .error-msg {
      margin-top: 10px;
      font-size: 12px;
      color: #b91c1c;
      min-height: 18px;
      font-weight: bold;
      word-break: break-word;
    }

    .app-shell {
      display: none;
      width: 100%;
      max-width: 980px;
      height: 92vh;
      max-height: 780px;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45);
    }
    .app-shell.active { display: flex; }

    .sidebar {
      width: 325px;
      background: #f7f7f8;
      border-right: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
    }
    .my-header {
      padding: 14px 16px;
      background: #fff;
      border-bottom: 1px solid #eceef2;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .my-info .my-email {
      font-size: 14px;
      font-weight: bold;
      color: #111;
    }
    .my-info .my-status {
      font-size: 12px;
      color: #16a34a;
      margin-top: 2px;
    }
    .logout-btn {
      padding: 6px 10px;
      font-size: 12px;
      border: 1px solid #d1d5db;
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
    }
    .logout-btn:hover { background: #f3f4f6; }

    .action-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #efefef;
      border-bottom: 1px solid #e5e7eb;
    }
    .action-tab-btn {
      padding: 9px 8px;
      border: none;
      background: transparent;
      font-size: 12px;
      font-weight: bold;
      color: #4b5563;
      cursor: pointer;
    }
    .action-tab-btn.active {
      background: #fafafa;
      color: #111;
      border-bottom: 2px solid #fee500;
    }

    .add-friend-box, .create-group-box {
      padding: 12px;
      background: #fafafa;
      border-bottom: 1px solid #e5e7eb;
    }
    .create-group-box { display: none; }
    .create-group-box.active { display: block; }
    .add-friend-box.hidden { display: none; }

    .add-friend-box input, .create-group-box input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 6px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      background: #fff;
    }
    .group-member-picker {
      max-height: 110px;
      overflow-y: auto;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 6px 8px;
      margin-bottom: 8px;
    }
    .group-member-option {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 3px 0;
      cursor: pointer;
    }
    .add-friend-box button, .create-group-box button {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: #fee500;
      color: #191919;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }
    .add-friend-box button:hover, .create-group-box button:hover { background: #f5dc00; }
    .add-friend-box button:disabled, .create-group-box button:disabled {
      background: #e5e7eb;
      color: #9ca3af;
      cursor: not-allowed;
    }

    .list-scroll-wrap {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 10px;
    }
    .friend-list-title {
      padding: 10px 16px 6px;
      font-size: 12px;
      color: #6b7280;
      font-weight: bold;
    }
    .friend-list {
      padding: 2px 8px;
    }
    .friend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 4px;
      gap: 8px;
    }
    .friend-item:hover { background: #eceff3; }
    .friend-item.selected { background: #fff3a1; }
    .friend-name { font-size: 14px; font-weight: bold; color: #111; }
    .friend-sub { font-size: 11px; color: #6b7280; margin-top: 2px; }

    .friend-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .unread-badge {
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 999px;
      background: #ef4444;
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .presence-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: bold;
    }
    .online { background: #dcfce7; color: #15803d; }
    .offline { background: #e5e7eb; color: #4b5563; }
    .group-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: bold;
      background: #dbeafe;
      color: #1d4ed8;
    }

    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #b2c7d9;
      position: relative;
    }
    .chat-header {
      padding: 14px 18px;
      background: #a3bacd;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .chat-header-title {
      font-size: 15px;
      font-weight: bold;
      color: #111827;
    }
    .chat-header-sub {
      font-size: 12px;
      color: #1f2937;
      margin-top: 2px;
    }
    .voice-call-btn {
      padding: 7px 12px;
      border: none;
      border-radius: 8px;
      background: #16a34a;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }
    .voice-call-btn:hover:not(:disabled) {
      background: #15803d;
    }
    .voice-call-btn:disabled {
      background: rgba(255, 255, 255, 0.45);
      color: #4b5563;
      cursor: not-allowed;
    }

    .call-banner {
      display: none;
      padding: 10px 16px;
      background: #1f2937;
      color: #fff;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }
    .call-banner.active {
      display: flex;
    }
    .call-controls {
      display: flex;
      gap: 6px;
    }
    .call-btn {
      padding: 5px 10px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .call-btn.accept { background: #22c55e; color: #111; }
    .call-btn.mute { background: #374151; color: #fff; border: 1px solid #6b7280; }
    .call-btn.mute.muted { background: #f59e0b; color: #111; border-color: #f59e0b; }
    .call-btn.hangup { background: #ef4444; color: #fff; }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .empty-chat {
      margin: auto;
      background: rgba(255, 255, 255, 0.75);
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 13px;
      color: #374151;
      text-align: center;
      line-height: 1.5;
    }
    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 72%;
    }
    .msg-row.mine { align-self: flex-end; align-items: flex-end; }
    .msg-row.theirs { align-self: flex-start; align-items: flex-start; }

    .msg-sender {
      font-size: 11px;
      color: #1f2937;
      margin-bottom: 3px;
      padding: 0 4px;
      font-weight: bold;
    }
    .msg-bubble-wrap {
      display: flex;
      align-items: flex-end;
      gap: 6px;
    }
    .msg-row.mine .msg-bubble-wrap { flex-direction: row-reverse; }

    .msg-bubble {
      padding: 9px 13px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.45;
      word-break: break-word;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }
    .msg-row.mine .msg-bubble {
      background: #fee500;
      color: #191919;
      border-top-right-radius: 4px;
    }
    .msg-row.theirs .msg-bubble {
      background: #ffffff;
      color: #111827;
      border-top-left-radius: 4px;
    }
    .msg-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      flex-shrink: 0;
    }
    .msg-row.theirs .msg-meta {
      align-items: flex-start;
    }
    .msg-time {
      font-size: 10px;
      color: #374151;
      white-space: nowrap;
    }
    .msg-delete-btn {
      border: none;
      background: rgba(0, 0, 0, 0.14);
      color: #1f2937;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }
    .msg-delete-btn:hover {
      background: #ef4444;
      color: #ffffff;
    }

    .emoji-hint-toast {
      display: none;
      position: absolute;
      left: 12px;
      bottom: 62px;
      background: #111827;
      color: #fff;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      z-index: 20;
    }
    .emoji-hint-toast.show {
      display: block;
    }

    .chat-input-area {
      background: #ffffff;
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      border-top: 1px solid #d1d5db;
      align-items: center;
    }
    .emoji-trigger-btn {
      width: 38px;
      height: 38px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #f9fafb;
      font-size: 19px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .emoji-trigger-btn:hover:not(:disabled) {
      background: #f3f4f6;
    }
    .emoji-trigger-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .chat-input-area input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
    }
    .chat-input-area button[type="submit"] {
      height: 38px;
      padding: 0 18px;
      border: none;
      border-radius: 8px;
      background: #fee500;
      color: #191919;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .chat-input-area button[type="submit"]:disabled {
      background: #e5e7eb;
      color: #9ca3af;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="login-box" id="loginBox">
    <h1>프라이빗 메신저</h1>
    <p>1:1 채팅 · 단체톡 · 보이스톡</p>
    <input type="email" id="loginEmail" placeholder="아이디(영문 이메일)" autocomplete="username" />
    <input type="password" id="loginPassword" placeholder="비밀번호" autocomplete="current-password" />
    <button id="loginBtn" type="button">로그인</button>
    <div class="error-msg" id="loginError"></div>
  </div>

  <div class="app-shell" id="appShell">
    <aside class="sidebar">
      <div class="my-header">
        <div class="my-info">
          <div class="my-email" id="myEmailLabel">-</div>
          <div class="my-status" id="myStatusLabel">● 접속 중</div>
        </div>
        <button class="logout-btn" id="logoutBtn" type="button">로그아웃</button>
      </div>

      <div class="action-tabs">
        <button type="button" class="action-tab-btn active" id="tabFriendBtn">+ 친구 추가</button>
        <button type="button" class="action-tab-btn" id="tabGroupBtn">+ 단체톡 만들기</button>
      </div>

      <div class="add-friend-box" id="addFriendBox">
        <input type="text" id="friendNameInput" placeholder="친구 이름 (예: 민수)" />
        <input type="email" id="friendEmailInput" placeholder="친구 계정 이메일" />
        <button id="addFriendBtn" type="button">+ 친구 추가</button>
      </div>

      <div class="create-group-box" id="createGroupBox">
        <input type="text" id="groupTitleInput" placeholder="단체톡 방 이름 (예: 프로젝트 팀방)" />
        <div class="group-member-picker" id="groupMemberPicker">
          <div style="font-size:11px;color:#6b7280;">초대할 친구가 없습니다. 먼저 친구를 추가하세요.</div>
        </div>
        <button id="createGroupBtn" type="button">단체톡 방 생성</button>
      </div>

      <div class="list-scroll-wrap">
        <div class="friend-list-title">단체톡 목록</div>
        <div class="friend-list" id="groupList"></div>

        <div class="friend-list-title">친구 목록 (1:1)</div>
        <div class="friend-list" id="friendList"></div>
      </div>
    </aside>

    <section class="chat-panel">
      <div class="chat-header">
        <div>
          <div class="chat-header-title" id="chatTitle">대화방을 선택하세요</div>
          <div class="chat-header-sub" id="chatSubtitle">좌측 목록에서 친구 또는 단체톡을 클릭하면 대화가 열립니다.</div>
        </div>
        <button type="button" class="voice-call-btn" id="voiceCallBtn" disabled>📞 보이스톡</button>
      </div>

      <div class="call-banner" id="callBanner">
        <span id="callStatusText">보이스톡 연결 중...</span>
        <div class="call-controls" id="callControls"></div>
      </div>

      <audio id="remoteAudio" autoplay playsinline></audio>

      <div class="messages" id="messagesBox">
        <div class="empty-chat">친구를 선택해 1:1 대화·보이스톡을 하거나,<br/>단체톡을 만들어 여럿이 함께 대화해 보세요!</div>
      </div>

      <div class="emoji-hint-toast" id="emojiHintToast">
        입력창에 포커스를 맞췄습니다. <strong>Win + .</strong> 을 눌러 Windows 이모지 창을 여세요.
      </div>

      <form class="chat-input-area" id="chatForm">
        <button type="button" class="emoji-trigger-btn" id="emojiTriggerBtn" title="Windows 이모지(Win + .) 입력 안내" disabled>😀</button>
        <input type="text" id="messageInput" placeholder="메시지를 입력하세요... (Win + . 으로 이모지 선택)" disabled />
        <button type="submit" id="sendBtn" disabled>전송</button>
      </form>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import {
      getDatabase,
      ref,
      set,
      push,
      remove,
      onValue,
      onChildAdded,
      onDisconnect,
      serverTimestamp,
      off
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCFS4DUAlwNEE1XqcRpb-qbmaDxbbe6uwM",
      authDomain: "friend-chat-86116.firebaseapp.com",
      databaseURL: "https://friend-chat-86116-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "friend-chat-86116",
      storageBucket: "friend-chat-86116.firebasestorage.app",
      messagingSenderId: "405206237942",
      appId: "1:405206237942:web:df497ac5990e5d5b2ba2d7",
      measurementId: "G-M3Q0KXDS91"
    };

    const RTC_CONFIG = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" }
      ]
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const loginBox = document.getElementById("loginBox");
    const appShell = document.getElementById("appShell");
    const loginEmail = document.getElementById("loginEmail");
    const loginPassword = document.getElementById("loginPassword");
    const loginBtn = document.getElementById("loginBtn");
    const loginError = document.getElementById("loginError");

    const myEmailLabel = document.getElementById("myEmailLabel");
    const logoutBtn = document.getElementById("logoutBtn");

    const tabFriendBtn = document.getElementById("tabFriendBtn");
    const tabGroupBtn = document.getElementById("tabGroupBtn");
    const addFriendBox = document.getElementById("addFriendBox");
    const createGroupBox = document.getElementById("createGroupBox");

    const friendNameInput = document.getElementById("friendNameInput");
    const friendEmailInput = document.getElementById("friendEmailInput");
    const addFriendBtn = document.getElementById("addFriendBtn");

    const groupTitleInput = document.getElementById("groupTitleInput");
    const groupMemberPicker = document.getElementById("groupMemberPicker");
    const createGroupBtn = document.getElementById("createGroupBtn");

    const groupListEl = document.getElementById("groupList");
    const friendListEl = document.getElementById("friendList");

    const chatTitle = document.getElementById("chatTitle");
    const chatSubtitle = document.getElementById("chatSubtitle");
    const voiceCallBtn = document.getElementById("voiceCallBtn");
    const callBanner = document.getElementById("callBanner");
    const callStatusText = document.getElementById("callStatusText");
    const callControls = document.getElementById("callControls");
    const remoteAudio = document.getElementById("remoteAudio");

    const messagesBox = document.getElementById("messagesBox");
    const emojiHintToast = document.getElementById("emojiHintToast");
    const emojiTriggerBtn = document.getElementById("emojiTriggerBtn");
    const chatForm = document.getElementById("chatForm");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");

    let currentUser = null;
    let allUsersMap = {};
    let allUsersByUid = {};
    let friendsMap = {};
    let myGroupIdsMap = {};
    let allGroupChatsMap = {};

    // activeRoom: { type: 'dm', friend } | { type: 'group', groupId }
    let activeRoom = null;
    let activeChatRef = null;

    let readStateMap = {};
    let unreadCounts = {};
    let latestMsgTsMap = {};
    let lastNotifiedMsgId = {};
    let roomWatchers = {};

    // WebRTC Voice Call state
    let peerConnection = null;
    let localStream = null;
    let currentCallId = null;
    let currentPeerUid = null;
    let callRefWatcher = null;
    let iceCandidateRef = null;
    let isMuted = false;
    let incomingCallData = null;

    let emojiHintTimer = null;
    emojiTriggerBtn.addEventListener("click", () => {
      if (messageInput.disabled) return;
      messageInput.focus();
      emojiHintToast.classList.add("show");
      clearTimeout(emojiHintTimer);
      emojiHintTimer = setTimeout(() => {
        emojiHintToast.classList.remove("show");
      }, 3500);
    });

    function setChatInputEnabled(enabled) {
      messageInput.disabled = !enabled;
      sendBtn.disabled = !enabled;
      emojiTriggerBtn.disabled = !enabled;
      if (!enabled) {
        emojiHintToast.classList.remove("show");
      }
    }

    function updateVoiceCallButtonState() {
      if (!currentUser || !activeRoom || activeRoom.type !== "dm" || !activeRoom.friend || !activeRoom.friend.uid) {
        voiceCallBtn.disabled = true;
        return;
      }
      const info = allUsersMap[normEmail(activeRoom.friend.email)];
      const isOnline = Boolean(info && info.online);
      voiceCallBtn.disabled = !isOnline || Boolean(currentCallId);
    }

    function normEmail(email) {
      return String(email || "").trim().toLowerCase();
    }

    function emailToKey(email) {
      return normEmail(email).replace(/[.#$[\]]/g, "_");
    }

    function getPrivateChatId(uidA, uidB) {
      return [uidA, uidB].sort().join("_");
    }

    function getGroupChatId(groupId) {
      return "group_" + groupId;
    }

    function getVisibleGroupIds() {
      if (!currentUser) return [];
      const setIds = new Set(Object.keys(myGroupIdsMap || {}));
      Object.entries(allGroupChatsMap || {}).forEach(([gId, gData]) => {
        if (gData && gData.members && gData.members[currentUser.uid]) {
          setIds.add(gId);
        }
      });
      return Array.from(setIds);
    }

    function getSenderDisplayName(msg) {
      if (!msg) return "알 수 없음";
      if (msg.senderUid === (currentUser && currentUser.uid)) return "나";
      const uByUid = msg.senderUid ? allUsersByUid[msg.senderUid] : null;
      const email = normEmail((uByUid && uByUid.email) || msg.senderEmail || "");
      const friendObj = Object.values(friendsMap).find((f) => normEmail(f.email) === email);
      return (friendObj && friendObj.name) || email || "참여자";
    }

    function getUserDisplayNameByUid(uid) {
      if (!uid) return "상대방";
      if (uid === (currentUser && currentUser.uid)) return "나";
      const u = allUsersByUid[uid];
      const em = normEmail(u && u.email);
      const fr = Object.values(friendsMap).find((f) => normEmail(f.email) === em);
      return (fr && fr.name) || em || uid.slice(0, 6);
    }

    function formatTime(ts) {
      if (!ts || typeof ts !== "number") return "";
      const d = new Date(ts);
      return d.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
    }

    function requestNotificationPermission() {
      if ("Notification" in window && Notification.permission === "default") {
        Notification.requestPermission().catch(() => {});
      }
    }

    function showDesktopNotification(roomOrSenderLabel, text) {
      if (!("Notification" in window) || Notification.permission !== "granted") return;
      if (document.hasFocus()) return;
      try {
        new Notification("새 톡 · " + roomOrSenderLabel, { body: text });
      } catch (_) {}

    // --- WebRTC Voice Call Functions ---
    function renderCallBanner(statusText, buttonsConfig) {
      callStatusText.textContent = statusText;
      callControls.innerHTML = "";
      buttonsConfig.forEach((b) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "call-btn " + b.className;
        btn.textContent = b.label;
        btn.addEventListener("click", b.onClick);
        callControls.appendChild(btn);
      });
      callBanner.classList.add("active");
    }

    function hideCallBanner() {
      callBanner.classList.remove("active");
      callControls.innerHTML = "";
      callStatusText.textContent = "";
    }

    async function ensureLocalAudio() {
      if (localStream) return localStream;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("이 브라우저는 마이크 음성 통화를 지원하지 않습니다. (HTTPS 또는 localhost 필요)");
      }
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      return localStream;
    }

    function createPeerConnection(callId, peerUid) {
      const pc = new RTCPeerConnection(RTC_CONFIG);

      if (localStream) {
        localStream.getTracks().forEach((track) => {
          pc.addTrack(track, localStream);
        });
      }

      pc.ontrack = (event) => {
        if (event.streams && event.streams[0]) {
          remoteAudio.srcObject = event.streams[0];
          remoteAudio.play().catch(() => {});
        }
      };

      const myCandidatesPath = `calls/${callId}/candidates/${currentUser.uid}`;
      const peerCandidatesPath = `calls/${callId}/candidates/${peerUid}`;

      pc.onicecandidate = async (event) => {
        if (event.candidate) {
          try {
            await push(ref(db, myCandidatesPath), event.candidate.toJSON());
          } catch (err) {
            console.error("ICE 후보 전송 실패:", err);
          }
        }
      };

      iceCandidateRef = ref(db, peerCandidatesPath);
      onChildAdded(iceCandidateRef, async (snap) => {
        const candData = snap.val();
        if (candData && pc.signalingState !== "closed") {
          try {
            await pc.addIceCandidate(new RTCIceCandidate(candData));
          } catch (err) {
            console.error("ICE 후보 추가 실패:", err);
          }
        }
      });

      return pc;
    }

    function cleanupCallLocal(removeDbCall = false) {
      const targetCallId = currentCallId;
      currentCallId = null;
      currentPeerUid = null;
      incomingCallData = null;
      isMuted = false;

      if (callRefWatcher) {
        off(callRefWatcher);
        callRefWatcher = null;
      }
      if (iceCandidateRef) {
        off(iceCandidateRef);
        iceCandidateRef = null;
      }
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      if (localStream) {
        localStream.getTracks().forEach((t) => t.stop());
        localStream = null;
      }
      if (remoteAudio.srcObject) {
        remoteAudio.srcObject = null;
      }

      hideCallBanner();
      updateVoiceCallButtonState();

      if (removeDbCall && targetCallId) {
        remove(ref(db, "calls/" + targetCallId)).catch(() => {});
      }
    }

    function toggleMute() {
      if (!localStream) return;
      isMuted = !isMuted;
      localStream.getAudioTracks().forEach((track) => {
        track.enabled = !isMuted;
      });
      const peerName = getUserDisplayNameByUid(currentPeerUid);
      renderCallBanner(
        isMuted ? `🎙️ ${peerName}님과 보이스톡 중 (내 마이크 음소거됨)` : `🔊 ${peerName}님과 보이스톡 연결됨`,
        [
          {
            label: isMuted ? "음소거 해제" : "음소거",
            className: "mute" + (isMuted ? " muted" : ""),
            onClick: toggleMute
          },
          {
            label: "통화 종료",
            className: "hangup",
            onClick: () => endVoiceCall("ended")
          }
        ]
      );
    }

    async function endVoiceCall(reason = "ended") {
      if (!currentCallId) {
        cleanupCallLocal(false);
        return;
      }
      try {
        await set(ref(db, `calls/${currentCallId}/status`), reason);
      } catch (_) {}
      setTimeout(() => cleanupCallLocal(true), 300);
    }

    async function startOutgoingVoiceCall(peerUid) {
      if (!currentUser || !peerUid || currentCallId) return;
      const callId = getPrivateChatId(currentUser.uid, peerUid);
      currentCallId = callId;
      currentPeerUid = peerUid;
      updateVoiceCallButtonState();

      const peerName = getUserDisplayNameByUid(peerUid);
      renderCallBanner(`📞 ${peerName}님에게 보이스톡 거는 중...`, [
        {
          label: "취소",
          className: "hangup",
          onClick: () => endVoiceCall("cancelled")
        }
      ]);

      try {
        await ensureLocalAudio();
        peerConnection = createPeerConnection(callId, peerUid);
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        await set(ref(db, "calls/" + callId), {
          callerUid: currentUser.uid,
          calleeUid: peerUid,
          status: "ringing",
          offer: { type: offer.type, sdp: offer.sdp },
          answer: null,
          candidates: null,
          updatedAt: Date.now()
        });

        const cRef = ref(db, "calls/" + callId);
        callRefWatcher = cRef;
        onValue(cRef, async (snap) => {
          const data = snap.val();
          if (!data) return;
          if (data.status === "rejected" || data.status === "cancelled" || data.status === "ended") {
            const msg =
              data.status === "rejected"
                ? `${peerName}님이 통화를 거절했습니다.`
                : "보이스톡이 종료되었습니다.";
            alert(msg);
            cleanupCallLocal(true);
            return;
          }
          if (data.answer && peerConnection && !peerConnection.currentRemoteDescription) {
            try {
              await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
              renderCallBanner(`🔊 ${peerName}님과 보이스톡 연결됨`, [
                {
                  label: "음소거",
                  className: "mute",
                  onClick: toggleMute
                },
                {
                  label: "통화 종료",
                  className: "hangup",
                  onClick: () => endVoiceCall("ended")
                }
              ]);
            } catch (err) {
              console.error("응답 SDP 설정 실패:", err);
            }
          }
        });
      } catch (err) {
        console.error("보이스톡 발신 실패:", err);
        alert("보이스톡을 시작할 수 없습니다: " + (err && err.message ? err.message : err));
        cleanupCallLocal(true);
      }
    }

    async function acceptIncomingVoiceCall() {
      if (!currentUser || !incomingCallData) return;
      const { callId, callerUid, offer } = incomingCallData;
      currentCallId = callId;
      currentPeerUid = callerUid;
      incomingCallData = null;

      const callerName = getUserDisplayNameByUid(callerUid);
      renderCallBanner(`🔊 ${callerName}님과 보이스톡 연결 중...`, [
        {
          label: "통화 종료",
          className: "hangup",
          onClick: () => endVoiceCall("ended")
        }
      ]);

      try {
        await ensureLocalAudio();
        peerConnection = createPeerConnection(callId, callerUid);
        await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        await set(ref(db, `calls/${callId}/answer`), {
          type: answer.type,
          sdp: answer.sdp
        });
        await set(ref(db, `calls/${callId}/status`), "connected");

        const cRef = ref(db, "calls/" + callId);
        callRefWatcher = cRef;
        onValue(cRef, (snap) => {
          const data = snap.val();
          if (!data || data.status === "ended" || data.status === "cancelled") {
            cleanupCallLocal(false);
          }
        });

        renderCallBanner(`🔊 ${callerName}님과 보이스톡 연결됨`, [
          {
            label: "음소거",
            className: "mute",
            onClick: toggleMute
          },
          {
            label: "통화 종료",
            className: "hangup",
            onClick: () => endVoiceCall("ended")
          }
        ]);
      } catch (err) {
        console.error("보이스톡 수락 실패:", err);
        alert("통화 연결에 실패했습니다: " + (err && err.message ? err.message : err));
        await endVoiceCall("ended");
      }
    }

    async function rejectIncomingVoiceCall() {
      if (!incomingCallData) return;
      const { callId } = incomingCallData;
      incomingCallData = null;
      hideCallBanner();
      try {
        await set(ref(db, `calls/${callId}/status`), "rejected");
        setTimeout(() => remove(ref(db, "calls/" + callId)).catch(() => {}), 300);
      } catch (_) {}
    }

    function watchIncomingCallsForUser(uid) {
      onValue(ref(db, "calls"), (snap) => {
        if (!currentUser || currentCallId) return;
        const callsObj = snap.val() || {};
        for (const [cId, cData] of Object.entries(callsObj)) {
          if (!cData) continue;
          if (cData.calleeUid === uid && cData.status === "ringing" && cData.offer) {
            incomingCallData = {
              callId: cId,
              callerUid: cData.callerUid,
              offer: cData.offer
            };
            const callerName = getUserDisplayNameByUid(cData.callerUid);
            renderCallBanner(`📲 ${callerName}님에게서 보이스톡이 왔습니다.`, [
              {
                label: "수락",
                className: "accept",
                onClick: acceptIncomingVoiceCall
              },
              {
                label: "거절",
                className: "hangup",
                onClick: rejectIncomingVoiceCall
              }
            ]);
            break;
          }
        }
      });
    }

    voiceCallBtn.addEventListener("click", () => {
      if (!currentUser || !activeRoom || activeRoom.type !== "dm" || !activeRoom.friend || !activeRoom.friend.uid) return;
      startOutgoingVoiceCall(activeRoom.friend.uid);
    });

    // --- Chat & Room Functions ---
    async function markChatAsRead(roomKey, upToTs) {
      if (!currentUser || !roomKey) return;
      const maxTs = Math.max(Date.now(), Number(upToTs) || 0, Number(latestMsgTsMap[roomKey]) || 0);
      readStateMap[roomKey] = maxTs;
      unreadCounts[roomKey] = 0;
      renderGroupList();
      renderFriendList();
      updatePageTitle();
      try {
        await set(ref(db, "readState/" + currentUser.uid + "/" + roomKey), maxTs);
      } catch (err) {
        console.error("readState 저장 실패:", err);
      }
    }

    function updatePageTitle() {
      const total = Object.values(unreadCounts).reduce((acc, n) => acc + (n || 0), 0);
      document.title = total > 0 ? `(${total}) 프라이빗 메신저` : "프라이빗 메신저 (1:1 · 단체톡 · 보이스톡)";
    }

    function getActiveRoomKey() {
      if (!currentUser || !activeRoom) return null;
      if (activeRoom.type === "dm" && activeRoom.friend && activeRoom.friend.uid) {
        return getPrivateChatId(currentUser.uid, activeRoom.friend.uid);
      }
      if (activeRoom.type === "group" && activeRoom.groupId) {
        return getGroupChatId(activeRoom.groupId);
      }
      return null;
    }

    function syncRoomWatchers() {
      if (!currentUser) return;
      const desiredRooms = new Map();

      Object.values(friendsMap).forEach((f) => {
        const info = allUsersMap[normEmail(f.email)];
        if (info && info.uid) {
          const rKey = getPrivateChatId(currentUser.uid, info.uid);
          desiredRooms.set(rKey, {
            dbPath: "chats/" + rKey + "/messages",
            type: "dm",
            friendEmail: normEmail(f.email)
          });
        }
      });

      getVisibleGroupIds().forEach((gId) => {
        const rKey = getGroupChatId(gId);
        desiredRooms.set(rKey, {
          dbPath: "groupMessages/" + gId + "/messages",
          type: "group",
          groupId: gId
        });
      });

      Object.keys(roomWatchers).forEach((rKey) => {
        if (!desiredRooms.has(rKey)) {
          off(roomWatchers[rKey]);
          delete roomWatchers[rKey];
          delete unreadCounts[rKey];
          delete latestMsgTsMap[rKey];
        }
      });

      desiredRooms.forEach((meta, rKey) => {
        if (roomWatchers[rKey]) return;
        const cRef = ref(db, meta.dbPath);
        roomWatchers[rKey] = cRef;

        onValue(cRef, (snap) => {
          const msgsObj = snap.val() || {};
          const entries = Object.entries(msgsObj);
          const maxCreatedAt = entries.reduce((mx, [, m]) => Math.max(mx, Number(m && m.createdAt) || 0), 0);
          latestMsgTsMap[rKey] = maxCreatedAt;

          const lastRead = Number(readStateMap[rKey]) || 0;
          const isCurrentRoomOpen = getActiveRoomKey() === rKey && document.hasFocus();

          if (isCurrentRoomOpen) {
            unreadCounts[rKey] = 0;
            const latestEntry = entries[entries.length - 1];
            if (latestEntry) lastNotifiedMsgId[rKey] = latestEntry[0];
            markChatAsRead(rKey, maxCreatedAt);
            return;
          }

          let count = 0;
          entries.forEach(([, m]) => {
            if (!m) return;
            if (m.senderUid !== currentUser.uid && (Number(m.createdAt) || 0) > lastRead) {
              count += 1;
            }
          });
          unreadCounts[rKey] = count;

          const latestEntry = entries[entries.length - 1];
          if (latestEntry) {
            const [latestId, latestMsg] = latestEntry;
            if (
              latestMsg &&
              latestMsg.senderUid !== currentUser.uid &&
              (Number(latestMsg.createdAt) || 0) > lastRead &&
              lastNotifiedMsgId[rKey] !== latestId
            ) {
              lastNotifiedMsgId[rKey] = latestId;
              const senderLabel = getSenderDisplayName(latestMsg);
              if (meta.type === "group") {
                const gTitle = (allGroupChatsMap[meta.groupId] && allGroupChatsMap[meta.groupId].title) || "단체톡";
                showDesktopNotification(`${gTitle} · ${senderLabel}`, latestMsg.text || "새 메시지가 도착했습니다.");
              } else {
                showDesktopNotification(senderLabel, latestMsg.text || "새 메시지가 도착했습니다.");
              }
            }
          }

          renderGroupList();
          renderFriendList();
          updatePageTitle();
        });
      });
    }

            await onDisconnect(myUserRef).set({
              uid: user.uid,
              email: normEmail(user.email),
              online: false,
              lastSeen: serverTimestamp()
            });
            await set(myUserRef, {
              uid: user.uid,
              email: normEmail(user.email),
              online: true,
              lastSeen: Date.now()
            });

        });

        onValue(ref(db, "readState/" + user.uid), (snap) => {

          updateActiveRoomHeader();

      } else {
        cleanupCallLocal(false);
        currentUser = null;
        activeRoom = null;
        myGroupIdsMap = {};
        allGroupChatsMap = {};
        if (activeChatRef) {
          off(activeChatRef);
          activeChatRef = null;

    createGroupBtn.addEventListener("click", async () => {
      if (!currentUser) return;
      const title = groupTitleInput.value.trim();
      const checkedBoxes = Array.from(groupMemberPicker.querySelectorAll('input[type="checkbox"]:checked'));
      const invitedUids = checkedBoxes.map((cb) => cb.value).filter(Boolean);

      if (!title) {
        alert("단체톡 방 이름을 입력하세요.");
        return;
      }
      if (invitedUids.length < 1) {
        alert("단체톡에 초대할 친구를 1명 이상 선택하세요.");
        return;
      }

      const memberUidsSet = new Set([currentUser.uid, ...invitedUids]);
      const membersObj = {};
      memberUidsSet.forEach((uid) => {
        membersObj[uid] = true;
      });

      createGroupBtn.disabled = true;
      try {
        const newGroupRef = push(ref(db, "groupChats"));
        const groupId = newGroupRef.key;
        if (!groupId) {
          throw new Error("단체톡 방 ID를 생성하지 못했습니다.");
        }

        const groupPayload = {
          groupId,
          title,
          createdBy: currentUser.uid,
          createdAt: Date.now(),
          members: membersObj
        };

        await set(newGroupRef, groupPayload);
        await set(ref(db, "userGroups/" + currentUser.uid + "/" + groupId), true);

        allGroupChatsMap[groupId] = groupPayload;
        myGroupIdsMap[groupId] = true;

        groupTitleInput.value = "";
        checkedBoxes.forEach((cb) => { cb.checked = false; });

        openGroupChat(groupId);
      } catch (err) {
        console.error("단체톡 방 생성 실패:", err);
        alert("단체톡 방 생성에 실패했습니다.\nFirebase Realtime Database 규칙에 groupChats, userGroups가 추가되어 있는지 확인해 주세요.\n오류: " + (err && err.message ? err.message : err));
      } finally {
        createGroupBtn.disabled = false;
      }
    });

    function renderGroupList() {
      groupListEl.innerHTML = "";
      const gIds = getVisibleGroupIds();
      if (gIds.length === 0) {
        groupListEl.innerHTML = '<div style="padding:10px 12px;font-size:12px;color:#6b7280;text-align:center;">참여 중인 단체톡이 없습니다.</div>';
        return;
      }

      gIds.forEach((gId) => {
        const meta = allGroupChatsMap[gId] || {};
        const rKey = getGroupChatId(gId);
        const unread = unreadCounts[rKey] || 0;
        const memberCount = meta.members ? Object.keys(meta.members).length : 0;
        const isSelected = activeRoom && activeRoom.type === "group" && activeRoom.groupId === gId;

        const item = document.createElement("div");
        item.className = "friend-item" + (isSelected ? " selected" : "");

        const infoDiv = document.createElement("div");
        const titleEl = document.createElement("div");
        titleEl.className = "friend-name";
        titleEl.textContent = meta.title || "단체톡방";

        const subEl = document.createElement("div");
        subEl.className = "friend-sub";
        subEl.textContent = memberCount > 0 ? `참여자 ${memberCount}명` : "단체 채팅방";

        infoDiv.appendChild(titleEl);
        infoDiv.appendChild(subEl);

        const rightDiv = document.createElement("div");
        rightDiv.className = "friend-right";

        if (unread > 0) {
          const unreadEl = document.createElement("span");
          unreadEl.className = "unread-badge";
          unreadEl.textContent = unread > 99 ? "99+" : String(unread);
          rightDiv.appendChild(unreadEl);
        }

        const badge = document.createElement("span");
        badge.className = "group-badge";
        badge.textContent = "단체톡";
        rightDiv.appendChild(badge);

        item.appendChild(infoDiv);
        item.appendChild(rightDiv);

        item.addEventListener("click", () => openGroupChat(gId));
        groupListEl.appendChild(item);
      });
    }

    function renderFriendList() {
      friendListEl.innerHTML = "";
      const entries = Object.values(friendsMap);
      if (entries.length === 0) {
        friendListEl.innerHTML = '<div style="padding:16px;font-size:12px;color:#6b7280;text-align:center;">아직 추가된 친구가 없습니다.</div>';
        return;
      }

      entries.forEach((f) => {
        const fEmail = normEmail(f.email);
        const userInfo = allUsersMap[fEmail];
        const isOnline = Boolean(userInfo && userInfo.online);
        const cId = currentUser && userInfo && userInfo.uid ? getPrivateChatId(currentUser.uid, userInfo.uid) : null;
        const unread = cId ? (unreadCounts[cId] || 0) : 0;
        const isSelected = activeRoom && activeRoom.type === "dm" && activeRoom.friend && normEmail(activeRoom.friend.email) === fEmail;

        const item = document.createElement("div");
        item.className = "friend-item" + (isSelected ? " selected" : "");

        const nameDiv = document.createElement("div");
        const nameEl = document.createElement("div");
        nameEl.className = "friend-name";
        nameEl.textContent = f.name;

        const subEl = document.createElement("div");
        subEl.className = "friend-sub";
        subEl.textContent = fEmail;

        nameDiv.appendChild(nameEl);
        nameDiv.appendChild(subEl);

        const rightDiv = document.createElement("div");
        rightDiv.className = "friend-right";

        if (unread > 0) {
          const unreadEl = document.createElement("span");
          unreadEl.className = "unread-badge";
          unreadEl.textContent = unread > 99 ? "99+" : String(unread);
          rightDiv.appendChild(unreadEl);
        }

        const badge = document.createElement("span");
        badge.className = "presence-badge " + (isOnline ? "online" : "offline");
        badge.textContent = isOnline ? "접속 중" : "오프라인";
        rightDiv.appendChild(badge);

        item.appendChild(nameDiv);
        item.appendChild(rightDiv);

        item.addEventListener("click", () => {
          openChatWithFriend({ name: f.name, email: fEmail });
        });

        friendListEl.appendChild(item);
      });
    }

    function updateActiveRoomHeader() {
      if (!activeRoom) return;
      if (activeRoom.type === "dm" && activeRoom.friend) {
        const info = allUsersMap[normEmail(activeRoom.friend.email)];
        const isOnline = Boolean(info && info.online);
        chatTitle.textContent = activeRoom.friend.name;
        chatSubtitle.textContent = isOnline
          ? "● 현재 접속 중 (1:1 채팅 · 보이스톡 가능)"
          : (info && typeof info.lastSeen === "number" ? "오프라인 · 최근 접속 " + formatTime(info.lastSeen) : "오프라인 (1:1 채팅)");
      } else if (activeRoom.type === "group" && activeRoom.groupId) {
        const meta = allGroupChatsMap[activeRoom.groupId] || {};
        const memberUids = meta.members ? Object.keys(meta.members) : [];
        const names = memberUids.map((uid) => getUserDisplayNameByUid(uid));
        chatTitle.textContent = meta.title || "단체톡방";
        chatSubtitle.textContent = names.length > 0 ? `참여자 (${names.length}명): ${names.join(", ")}` : "단체 채팅방";
      }
    }

    async function deleteOwnMessage(dbPath, msgId, messageData) {
      if (!currentUser || !dbPath || !msgId || !messageData) return;
      if (messageData.senderUid !== currentUser.uid) {
        alert("본인이 보낸 메시지만 삭제할 수 있습니다.");
        return;
      }
      if (!confirm("이 메시지를 삭제하시겠습니까?")) return;

      try {
        await remove(ref(db, dbPath + "/" + msgId));
      } catch (err) {
        console.error("메시지 삭제 실패:", err);
        alert("메시지 삭제 중 오류가 발생했습니다.");
      }
    }

    function attachMessageListener(dbPath, roomKey, emptyText, isGroup) {
      if (activeChatRef) {
        off(activeChatRef);
        activeChatRef = null;
      }

      markChatAsRead(roomKey, latestMsgTsMap[roomKey]);
      activeChatRef = ref(db, dbPath);

      onValue(activeChatRef, (snap) => {
        messagesBox.innerHTML = "";
        const msgs = snap.val() || {};
        const entries = Object.entries(msgs);
        const maxCreatedAt = entries.reduce((mx, [, m]) => Math.max(mx, Number(m && m.createdAt) || 0), 0);
        latestMsgTsMap[roomKey] = maxCreatedAt;

        if (entries.length === 0) {
          messagesBox.innerHTML = `<div class="empty-chat">${emptyText}</div>`;
          return;
        }

        entries.forEach(([msgId, m]) => {
          if (!m) return;
          const isMine = m.senderUid === currentUser.uid;
          const row = document.createElement("div");
          row.className = "msg-row " + (isMine ? "mine" : "theirs");

          if (!isMine) {
            const senderEl = document.createElement("div");
            senderEl.className = "msg-sender";
            senderEl.textContent = isGroup
              ? getSenderDisplayName(m)
              : ((activeRoom && activeRoom.friend && activeRoom.friend.name) || getSenderDisplayName(m));
            row.appendChild(senderEl);
          }

          const wrap = document.createElement("div");
          wrap.className = "msg-bubble-wrap";

          const bubble = document.createElement("div");
          bubble.className = "msg-bubble";
          bubble.textContent = m.text;

          const metaEl = document.createElement("div");
          metaEl.className = "msg-meta";

          if (isMine) {
            const delBtn = document.createElement("button");
            delBtn.type = "button";
            delBtn.className = "msg-delete-btn";
            delBtn.textContent = "삭제";
            delBtn.title = "내가 보낸 메시지 삭제";
            delBtn.addEventListener("click", () => deleteOwnMessage(dbPath, msgId, m));
            metaEl.appendChild(delBtn);
          }

          const timeEl = document.createElement("div");
          timeEl.className = "msg-time";
          timeEl.textContent = formatTime(m.createdAt);
          metaEl.appendChild(timeEl);

          wrap.appendChild(bubble);
          wrap.appendChild(metaEl);
          row.appendChild(wrap);
          messagesBox.appendChild(row);
        });

        messagesBox.scrollTop = messagesBox.scrollHeight;
        if (document.hasFocus()) {
          markChatAsRead(roomKey, maxCreatedAt);
        }
      });
    }

    function openChatWithFriend(friend) {
      if (!currentUser) return;
      const fEmail = normEmail(friend.email);
      const info = allUsersMap[fEmail];
      activeRoom = {
        type: "dm",
        friend: {
          name: friend.name,
          email: fEmail,
          uid: info ? info.uid : null
        }
      };

      renderGroupList();
      renderFriendList();
      updateActiveRoomHeader();
      updateVoiceCallButtonState();

      if (activeChatRef) {
        off(activeChatRef);
        activeChatRef = null;
      }

      if (!activeRoom.friend.uid) {
        messagesBox.innerHTML = '<div class="empty-chat">친구가 아직 한 번도 로그인하지 않아 UID를 불러올 수 없습니다.<br/>친구가 먼저 로그인한 뒤 다시 클릭해 주세요.</div>';
        setChatInputEnabled(false);
        return;
      }

      setChatInputEnabled(true);

      const chatId = getPrivateChatId(currentUser.uid, activeRoom.friend.uid);
      attachMessageListener(
        "chats/" + chatId + "/messages",
        chatId,
        "1:1 대화방이 열렸습니다. 첫 메시지를 보내보세요!",
        false
      );
    }

    function openGroupChat(groupId) {
      if (!currentUser || !groupId) return;
      activeRoom = {
        type: "group",
        groupId
      };

      renderGroupList();
      renderFriendList();
      updateActiveRoomHeader();
      updateVoiceCallButtonState();

      setChatInputEnabled(true);

      const roomKey = getGroupChatId(groupId);
      attachMessageListener(
        "groupMessages/" + groupId + "/messages",
        roomKey,
        "단체톡방이 열렸습니다. 참여자들과 첫 메시지를 나눠보세요!",
        true
      );
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!currentUser || !activeRoom) return;
      const text = messageInput.value.trim();
      if (!text) return;

      const nowTs = Date.now();
      const payload = {
        senderUid: currentUser.uid,
        senderEmail: normEmail(currentUser.email),
        text,
        createdAt: nowTs
      };

      if (activeRoom.type === "dm" && activeRoom.friend && activeRoom.friend.uid) {
        const chatId = getPrivateChatId(currentUser.uid, activeRoom.friend.uid);
        await push(ref(db, "chats/" + chatId + "/messages"), payload);
        await markChatAsRead(chatId, nowTs);
      } else if (activeRoom.type === "group" && activeRoom.groupId) {
        const roomKey = getGroupChatId(activeRoom.groupId);
        await push(ref(db, "groupMessages/" + activeRoom.groupId + "/messages"), payload);
        await markChatAsRead(roomKey, nowTs);
      }

      emojiHintToast.classList.remove("show");
      messageInput.value = "";
      messageInput.focus();
    });
  </script>
</body>
</html>

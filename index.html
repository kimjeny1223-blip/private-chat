<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FEE500" />
  <title>프라이빗 메신저 (1:1 · 단체톡 · 보이스톡)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Malgun Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
      background: #1e1f22;
      color: #222;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      width: 360px;
      background: #fee500;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    .login-box h1 {
      font-size: 20px;
      margin-bottom: 8px;
      color: #191919;
    }
    .login-box p {
      font-size: 13px;
      color: #4a4000;
      margin-bottom: 20px;
    }
    .login-box input {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #e0c800;
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
    }
    .login-box button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #3c1e1e;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .login-box button:hover { background: #261212; }
    .error-msg {
      margin-top: 10px;
      font-size: 12px;
      color: #b91c1c;
      min-height: 18px;
      font-weight: bold;
      word-break: break-word;
    }

    .app-shell {
      display: none;
      width: 100%;
      max-width: 980px;
      height: 92vh;
      max-height: 780px;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45);
    }
    .app-shell.active { display: flex; }

    .sidebar {
      width: 325px;
      background: #f7f7f8;
      border-right: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
    }
    .my-header {
      padding: 14px 16px;
      background: #fff;
      border-bottom: 1px solid #eceef2;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .my-info .my-email {
      font-size: 14px;
      font-weight: bold;
      color: #111;
    }
    .my-info .my-status {
      font-size: 12px;
      color: #16a34a;
      margin-top: 2px;
    }
    .logout-btn {
      padding: 6px 10px;
      font-size: 12px;
      border: 1px solid #d1d5db;
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
    }
    .logout-btn:hover { background: #f3f4f6; }

    .action-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #efefef;
      border-bottom: 1px solid #e5e7eb;
    }
    .action-tab-btn {
      padding: 9px 8px;
      border: none;
      background: transparent;
      font-size: 12px;
      font-weight: bold;
      color: #4b5563;
      cursor: pointer;
    }
    .action-tab-btn.active {
      background: #fafafa;
      color: #111;
      border-bottom: 2px solid #fee500;
    }

    .add-friend-box, .create-group-box {
      padding: 12px;
      background: #fafafa;
      border-bottom: 1px solid #e5e7eb;
    }
    .create-group-box { display: none; }
    .create-group-box.active { display: block; }
    .add-friend-box.hidden { display: none; }

    .add-friend-box input, .create-group-box input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 6px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      background: #fff;
    }
    .group-member-picker {
      max-height: 110px;
      overflow-y: auto;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 6px 8px;
      margin-bottom: 8px;
    }
    .group-member-option {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 3px 0;
      cursor: pointer;
    }
    .add-friend-box button, .create-group-box button {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: #fee500;
      color: #191919;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }
    .add-friend-box button:hover, .create-group-box button:hover { background: #f5dc00; }
    .add-friend-box button:disabled, .create-group-box button:disabled {
      background: #e5e7eb;
      color: #9ca3af;
      cursor: not-allowed;
    }

    .list-scroll-wrap {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 10px;
    }
    .friend-list-title {
      padding: 10px 16px 6px;
      font-size: 12px;
      color: #6b7280;
      font-weight: bold;
    }
    .friend-list {
      padding: 2px 8px;
    }
    .friend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 4px;
      gap: 8px;
    }
    .friend-item:hover { background: #eceff3; }
    .friend-item.selected { background: #fff3a1; }
    .friend-name { font-size: 14px; font-weight: bold; color: #111; }
    .friend-sub { font-size: 11px; color: #6b7280; margin-top: 2px; }

    .friend-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .unread-badge {
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 999px;
      background: #ef4444;
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .presence-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: bold;
    }
    .online { background: #dcfce7; color: #15803d; }
    .offline { background: #e5e7eb; color: #4b5563; }
    .group-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: bold;
      background: #dbeafe;
      color: #1d4ed8;
    }

    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #b2c7d9;
      position: relative;
    }
    .chat-header {
      padding: 14px 18px;
      background: #a3bacd;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .chat-header-title {
      font-size: 15px;
      font-weight: bold;
      color: #111827;
    }
    .chat-header-sub {
      font-size: 12px;
      color: #1f2937;
      margin-top: 2px;
    }
    .voice-call-btn {
      padding: 7px 12px;
      border: none;
      border-radius: 8px;
      background: #16a34a;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }
    .voice-call-btn:hover:not(:disabled) {
      background: #15803d;
    }
    .voice-call-btn:disabled {
      background: rgba(255, 255, 255, 0.45);
      color: #4b5563;
      cursor: not-allowed;
    }

    .call-banner {
      display: none;
      padding: 10px 16px;
      background: #1f2937;
      color: #fff;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }
    .call-banner.active {
      display: flex;
    }
    .call-banner.connected {
      background: #14532d;
    }
    .call-controls {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .call-btn {
      padding: 5px 10px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .call-btn.accept { background: #22c55e; color: #111; }
    .call-btn.mute { background: #374151; color: #fff; border: 1px solid #6b7280; }
    .call-btn.mute.muted { background: #f59e0b; color: #111; border-color: #f59e0b; }
    .call-btn.hangup { background: #ef4444; color: #fff; }

    /* Incoming Call Modal */
    .incoming-modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }
    .incoming-modal-backdrop.open {
      display: flex;
    }
    .incoming-modal-card {
      width: 330px;
      background: #1f2937;
      color: #ffffff;
      border-radius: 18px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .ring-icon {
      font-size: 40px;
      margin-bottom: 10px;
      animation: ringShake 0.8s infinite ease-in-out;
    }
    @keyframes ringShake {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-14deg); }
      40% { transform: rotate(14deg); }
      60% { transform: rotate(-10deg); }
      80% { transform: rotate(10deg); }
    }
    .incoming-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .incoming-sub {
      font-size: 13px;
      color: #d1d5db;
      margin-bottom: 22px;
    }
    .incoming-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .modal-call-btn {
      padding: 12px 10px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .modal-call-btn.accept {
      background: #22c55e;
      color: #111827;
    }
    .modal-call-btn.accept:hover { background: #16a34a; color: #fff; }
    .modal-call-btn.reject {
      background: #ef4444;
      color: #ffffff;
    }
    .modal-call-btn.reject:hover { background: #dc2626; }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .empty-chat {
      margin: auto;
      background: rgba(255, 255, 255, 0.75);
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 13px;
      color: #374151;
      text-align: center;
      line-height: 1.5;
    }

    /* Call log / System event pill in chat */
    .system-msg-row {
      align-self: center;
      background: rgba(17, 24, 39, 0.45);
      color: #f9fafb;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: 85%;
    }
    .system-msg-time {
      font-size: 10px;
      color: #e5e7eb;
      opacity: 0.85;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 72%;
    }
    .msg-row.mine { align-self: flex-end; align-items: flex-end; }
    .msg-row.theirs { align-self: flex-start; align-items: flex-start; }

    .msg-sender {
      font-size: 11px;
      color: #1f2937;
      margin-bottom: 3px;
      padding: 0 4px;
      font-weight: bold;
    }
    .msg-bubble-wrap {
      display: flex;
      align-items: flex-end;
      gap: 6px;
    }
    .msg-row.mine .msg-bubble-wrap { flex-direction: row-reverse; }

    .msg-bubble {
      padding: 9px 13px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.45;
      word-break: break-word;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }
    .msg-row.mine .msg-bubble {
      background: #fee500;
      color: #191919;
      border-top-right-radius: 4px;
    }
    .msg-row.theirs .msg-bubble {
      background: #ffffff;
      color: #111827;
      border-top-left-radius: 4px;
    }
    .msg-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      flex-shrink: 0;
    }
    .msg-row.theirs .msg-meta {
      align-items: flex-start;
    }
    .msg-time {
      font-size: 10px;
      color: #374151;
      white-space: nowrap;
    }
    .msg-delete-btn {
      border: none;
      background: rgba(0, 0, 0, 0.14);
      color: #1f2937;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }
    .msg-delete-btn:hover {
      background: #ef4444;
      color: #ffffff;
    }

    .emoji-picker-panel {
      display: none;
      position: absolute;
      left: 12px;
      bottom: 62px;
      width: 390px;
      max-width: calc(100% - 24px);
      height: 310px;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.22);
      z-index: 25;
      flex-direction: column;
      overflow: hidden;
    }
    .emoji-picker-panel.open {
      display: flex;
    }
    .emoji-cat-bar {
      display: flex;
      gap: 4px;
      padding: 8px;
      background: #f3f4f6;
      border-bottom: 1px solid #e5e7eb;
      overflow-x: auto;
    }
    .emoji-cat-btn {
      border: none;
      background: transparent;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      color: #4b5563;
      cursor: pointer;
      white-space: nowrap;
    }
    .emoji-cat-btn.active {
      background: #fee500;
      color: #111;
    }
    .emoji-grid {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      align-content: start;
    }
    .emoji-cell-btn {
      height: 34px;
      border: none;
      background: transparent;
      border-radius: 6px;
      font-size: 20px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .emoji-cell-btn:hover {
      background: #f3f4f6;
    }
    .emoji-footer-note {
      padding: 5px 10px;
      font-size: 11px;
      color: #6b7280;
      background: #fafafa;
      border-top: 1px solid #e5e7eb;
    }

    .chat-input-area {
      background: #ffffff;
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      border-top: 1px solid #d1d5db;
      align-items: center;
    }
    .emoji-toggle-btn {
      width: 38px;
      height: 38px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #f9fafb;
      font-size: 19px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .emoji-toggle-btn:hover:not(:disabled) {
      background: #f3f4f6;
    }
    .emoji-toggle-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .chat-input-area input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
    }
    .chat-input-area button[type="submit"] {
      height: 38px;
      padding: 0 18px;
      border: none;
      border-radius: 8px;
      background: #fee500;
      color: #191919;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .chat-input-area button[type="submit"]:disabled {
      background: #e5e7eb;
      color: #9ca3af;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="login-box" id="loginBox">
    <h1>프라이빗 메신저</h1>
    <p>1:1 채팅 · 단체톡 · 보이스톡</p>
    <input type="email" id="loginEmail" placeholder="아이디(영문 이메일)" autocomplete="username" />
    <input type="password" id="loginPassword" placeholder="비밀번호" autocomplete="current-password" />
    <button id="loginBtn" type="button">로그인</button>
    <div class="error-msg" id="loginError"></div>
  </div>

  <div class="app-shell" id="appShell">
    <aside class="sidebar">
      <div class="my-header">
        <div class="my-info">
          <div class="my-email" id="myEmailLabel">-</div>
          <div class="my-status" id="myStatusLabel">● 접속 중</div>
        </div>
        <button class="logout-btn" id="logoutBtn" type="button">로그아웃</button>
      </div>

      <div class="action-tabs">
        <button type="button" class="action-tab-btn active" id="tabFriendBtn">+ 친구 추가</button>
        <button type="button" class="action-tab-btn" id="tabGroupBtn">+ 단체톡 만들기</button>
      </div>

      <div class="add-friend-box" id="addFriendBox">
        <input type="text" id="friendNameInput" placeholder="친구 이름 (예: 민수)" />
        <input type="email" id="friendEmailInput" placeholder="친구 계정 이메일" />
        <button id="addFriendBtn" type="button">+ 친구 추가</button>
      </div>

      <div class="create-group-box" id="createGroupBox">
        <input type="text" id="groupTitleInput" placeholder="단체톡 방 이름 (예: 프로젝트 팀방)" />
        <div class="group-member-picker" id="groupMemberPicker">
          <div style="font-size:11px;color:#6b7280;">초대할 친구가 없습니다. 먼저 친구를 추가하세요.</div>
        </div>
        <button id="createGroupBtn" type="button">단체톡 방 생성</button>
      </div>

      <div class="list-scroll-wrap">
        <div class="friend-list-title">단체톡 목록</div>
        <div class="friend-list" id="groupList"></div>

        <div class="friend-list-title">친구 목록 (1:1)</div>
        <div class="friend-list" id="friendList"></div>
      </div>
    </aside>

    <section class="chat-panel">
      <div class="chat-header">
        <div>
          <div class="chat-header-title" id="chatTitle">대화방을 선택하세요</div>
          <div class="chat-header-sub" id="chatSubtitle">좌측 목록에서 친구 또는 단체톡을 클릭하면 대화가 열립니다.</div>
        </div>
        <button type="button" class="voice-call-btn" id="voiceCallBtn" disabled>📞 보이스톡</button>
      </div>

      <div class="call-banner" id="callBanner">
        <span id="callStatusText">보이스톡 연결 중...</span>
        <div class="call-controls" id="callControls"></div>
      </div>

      <audio id="remoteAudio" autoplay playsinline></audio>

      <div class="messages" id="messagesBox">
        <div class="empty-chat">친구를 선택해 1:1 대화·보이스톡을 하거나,<br/>단체톡을 만들어 여럿이 함께 대화해 보세요!</div>
      </div>

      <div class="emoji-picker-panel" id="emojiPickerPanel" aria-label="전체 이모지 선택창">
        <div class="emoji-cat-bar" id="emojiCatBar"></div>
        <div class="emoji-grid" id="emojiGrid"></div>
        <div class="emoji-footer-note">유니코드 이모지 전체 모음 · Windows 기본창은 Win + .</div>
      </div>

      <form class="chat-input-area" id="chatForm">
        <button type="button" class="emoji-toggle-btn" id="emojiToggleBtn" title="이모지 선택창 열기" disabled>😀</button>
        <input type="text" id="messageInput" placeholder="메시지를 입력하세요..." disabled />
        <button type="submit" id="sendBtn" disabled>전송</button>
      </form>
    </section>
  </div>

  <!-- Incoming Voice Call Modal -->
  <div class="incoming-modal-backdrop" id="incomingCallModal" role="dialog" aria-modal="true" aria-labelledby="incomingCallerTitle">
    <div class="incoming-modal-card">
      <div class="ring-icon">📞</div>
      <div class="incoming-title" id="incomingCallerTitle">보이스톡 수신 중</div>
      <div class="incoming-sub" id="incomingCallerSub">음성 통화 요청이 왔습니다.</div>
      <div class="incoming-actions">
        <button type="button" class="modal-call-btn accept" id="modalAcceptCallBtn">통화</button>
        <button type="button" class="modal-call-btn reject" id="modalRejectCallBtn">거절</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import {
      getDatabase,
      ref,
      set,
      push,
      get,
      update,
      remove,
      onValue,
      onChildAdded,
      onDisconnect,
      serverTimestamp,

    function playIncomingRingCycle() {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const notes = [880, 1174.66];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, now + idx * 0.16);
          gain.gain.setValueAtTime(0.001, now + idx * 0.16);
          gain.gain.exponentialRampToValueAtTime(0.15, now + idx * 0.16 + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.16 + 0.28);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.16);
          osc.stop(now + idx * 0.16 + 0.3);
        });
      } catch (_) {}
    }

    function playRingbackCycle() {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const gain = ctx.createGain();

        osc1.type = "sine";
        osc2.type = "sine";
        osc1.frequency.setValueAtTime(440, now);
        osc2.frequency.setValueAtTime(480, now);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(0.09, now + 0.04);
        gain.gain.setValueAtTime(0.09, now + 0.85);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.95);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(ctx.destination);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 1.0);
        osc2.stop(now + 1.0);
      } catch (_) {}
    }

    async function pruneOldMessagesAtPath(dbPath) {
      if (!currentUser || !dbPath || cleanedPathsSet.has(dbPath)) return;
      cleanedPathsSet.add(dbPath);
      try {
        const snap = await get(ref(db, dbPath));
        const val = snap.val();
        if (!val) return;

        const cutoffTs = Date.now() - RETENTION_MS;
        const sortedEntries = Object.entries(val).sort(
          (a, b) => (Number(a[1] && a[1].createdAt) || 0) - (Number(b[1] && b[1].createdAt) || 0)
        );

        const updates = {};
        let deleteCount = 0;
        for (const [msgId, msg] of sortedEntries) {
          const ts = Number(msg && msg.createdAt) || 0;
          if (ts > 0 && ts < cutoffTs) {
            updates[dbPath + "/" + msgId] = null;
            deleteCount += 1;
          } else {
            break; // 가장 오래된 데이터부터 정렬되어 있으므로 기준 이후는 중단
          }
        }

        if (deleteCount > 0) {
          await update(ref(db), updates);
        }
      } catch (err) {
        console.warn("오래된 메시지 정리 건너뜀:", dbPath, err);
      }
    }

    async function ensureLocalAudio() {
      if (localStream) {
        const hasLiveTrack = localStream.getAudioTracks().some((t) => t.readyState === "live");
        if (hasLiveTrack) return localStream;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("이 브라우저는 마이크 음성 통화를 지원하지 않습니다. (HTTPS 또는 localhost 필요)");
      }
      localStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        },
        video: false
      });
      return localStream;
    }

    async function flushPendingCandidates(pc) {
      if (!pc || !pc.remoteDescription) return;
      while (pendingRemoteCandidates.length > 0) {
        const cand = pendingRemoteCandidates.shift();
        try {
          await pc.addIceCandidate(new RTCIceCandidate(cand));
        } catch (err) {
          console.error("대기 ICE 후보 추가 실패:", err);
        }
      }
    }

    function createPeerConnection(callId, peerUid) {
      pendingRemoteCandidates = [];
      const pc = new RTCPeerConnection(RTC_CONFIG);

      if (localStream) {
        localStream.getTracks().forEach((track) => {
          track.enabled = true;
          pc.addTrack(track, localStream);
        });
      }

      pc.ontrack = (event) => {
        const stream = (event.streams && event.streams[0]) || new MediaStream([event.track]);
        remoteAudio.srcObject = stream;
        remoteAudio.muted = false;
        remoteAudio.volume = 1.0;
        remoteAudio.play().catch((err) => {
          console.warn("오디오 자동 재생 재시도:", err);
        });
      };

      const myCandidatesPath = `calls/${callId}/candidates/${currentUser.uid}`;
      const peerCandidatesPath = `calls/${callId}/candidates/${peerUid}`;

      pc.onicecandidate = async (event) => {
        if (event.candidate) {
          try {
            await push(ref(db, myCandidatesPath), event.candidate.toJSON());
          } catch (err) {
            console.error("ICE 후보 전송 실패:", err);
          }
        }
      };

      iceCandidateRef = ref(db, peerCandidatesPath);
      onChildAdded(iceCandidateRef, async (snap) => {
        const candData = snap.val();
        if (!candData || pc.signalingState === "closed") return;
        if (!pc.remoteDescription) {
          pendingRemoteCandidates.push(candData);
          return;
        }
        try {
          await pc.addIceCandidate(new RTCIceCandidate(candData));
        } catch (err) {
          console.error("ICE 후보 추가 실패:", err);
        }
      });

      return pc;
    }

      if (peerConnection) {

        peerConnection = null;
      }
      if (localStream) {
        localStream.getTracks().forEach((t) => t.stop());

      if (!currentUser || !peerUid || currentCallId) return;
      const callId = getPrivateChatId(currentUser.uid, peerUid);
      currentCallId = callId;
      currentPeerUid = peerUid;
      callConnectedAt = null;
      hasLoggedEndForCallId = null;
      updateVoiceCallButtonState();

      const peerName = getUserDisplayNameByUid(peerUid);
      renderCallBanner(`📞 ${peerName}님에게 보이스톡 거는 중...`, [
        {
          label: "취소",
          className: "hangup",
          onClick: () => endVoiceCall("cancelled")
        }
      ]);

      startRingbackTone();

      try {
        // 이전 통화 잔여 노드 먼저 삭제하여 두 번째 통화 시 충돌 방지
        await remove(ref(db, "calls/" + callId));

        await ensureLocalAudio();
        peerConnection = createPeerConnection(callId, peerUid);
        const offer = await peerConnection.createOffer({ offerToReceiveAudio: true });
        await peerConnection.setLocalDescription(offer);

        await set(ref(db, "calls/" + callId), {
          callerUid: currentUser.uid,
          calleeUid: peerUid,
          status: "ringing",
          offer: { type: offer.type, sdp: offer.sdp },
          answer: null,
          candidates: null,
          updatedAt: Date.now()
        });

        const cRef = ref(db, "calls/" + callId);
        callRefWatcher = cRef;
        onValue(cRef, async (snap) => {
          const data = snap.val();
          if (!data) return;

          if (data.status === "rejected" || data.status === "cancelled" || data.status === "ended") {
            stopAllTones();
            if (hasLoggedEndForCallId !== callId) {
              hasLoggedEndForCallId = callId;
              if (data.status === "rejected") {
                await appendCallSystemMessage(peerUid, "📵 부재중 보이스톡 (상대방 거절)");
              } else if (data.status === "ended" && callConnectedAt) {
                const durationText = formatDuration(Date.now() - callConnectedAt);
                await appendCallSystemMessage(peerUid, `📴 보이스톡 종료 (${durationText})`);
              }
            }
            cleanupCallLocal(true);
            return;
          }

          if (data.answer && peerConnection && !peerConnection.currentRemoteDescription) {
            stopAllTones();
            try {
              await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
              await flushPendingCandidates(peerConnection);
              enterConnectedCallUi(peerName);
            } catch (err) {
              console.error("응답 SDP 설정 실패:", err);
            }
          }
        });
      } catch (err) {
        stopAllTones();
        console.error("보이스톡 발신 실패:", err);
        alert("보이스톡을 시작할 수 없습니다: " + (err && err.message ? err.message : err));
        cleanupCallLocal(true);
      }
    }

    async function acceptIncomingVoiceCall() {
      if (!currentUser || !incomingCallData) return;
      stopAllTones();
      const { callId, callerUid, offer } = incomingCallData;
      currentCallId = callId;
      currentPeerUid = callerUid;
      callConnectedAt = null;
      hasLoggedEndForCallId = null;
      incomingCallData = null;
      hideIncomingCallModal();
      updateVoiceCallButtonState();

      const callerName = getUserDisplayNameByUid(callerUid);
      renderCallBanner(`🔊 ${callerName}님과 보이스톡 연결 중...`, [
        {
          label: "통화 종료",
          className: "hangup",
          onClick: () => endVoiceCall("ended")
        }
      ]);

      try {
        await ensureLocalAudio();
        peerConnection = createPeerConnection(callId, callerUid);
        await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
        await flushPendingCandidates(peerConnection);

        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        await set(ref(db, `calls/${callId}/answer`), {
          type: answer.type,
          sdp: answer.sdp
        });
        await set(ref(db, `calls/${callId}/status`), "connected");

        // 통화 연결 기록 채팅창에 저장
        await appendCallSystemMessage(callerUid, "📞 보이스톡 통화 시작");

        const cRef = ref(db, "calls/" + callId);
        callRefWatcher = cRef;
        onValue(cRef, async (snap) => {
          const data = snap.val();
          if (!data || data.status === "ended" || data.status === "cancelled") {
            if (hasLoggedEndForCallId !== callId && callConnectedAt) {
              hasLoggedEndForCallId = callId;
              const durationText = formatDuration(Date.now() - callConnectedAt);
              await appendCallSystemMessage(callerUid, `📴 보이스톡 종료 (${durationText})`);
            }
            cleanupCallLocal(false);
          }
        });

        enterConnectedCallUi(callerName);
      } catch (err) {
        console.error("보이스톡 수락 실패:", err);
        alert("통화 연결에 실패했습니다: " + (err && err.message ? err.message : err));
        await endVoiceCall("ended");
      }
    }

    async function rejectIncomingVoiceCall() {
      stopAllTones();
      hideIncomingCallModal();
      if (!incomingCallData) return;
      const { callId, callerUid } = incomingCallData;
      incomingCallData = null;
      hideCallBanner();
      try {

        setTimeout(() => remove(ref(db, "calls/" + callId)).catch(() => {}), 300);
      } catch (_) {}
    }

    function syncIncomingCallWatchers() {
      if (!currentUser) return;
      const desiredCallIds = new Set();

      Object.values(friendsMap).forEach((f) => {
        const info = allUsersMap[normEmail(f.email)];
        if (info && info.uid && info.uid !== currentUser.uid) {
          desiredCallIds.add(getPrivateChatId(currentUser.uid, info.uid));

      });

      Object.values(allUsersByUid).forEach((u) => {

          desiredCallIds.add(getPrivateChatId(currentUser.uid, u.uid));
        }
      });

      Object.keys(incomingCallWatchers).forEach((cId) => {

          off(incomingCallWatchers[cId]);
          delete incomingCallWatchers[cId];
        }
      });

      desiredCallIds.forEach((cId) => {
        if (incomingCallWatchers[cId]) return;
        const cRef = ref(db, "calls/" + cId);
        incomingCallWatchers[cId] = cRef;

            if (!currentCallId && (!incomingCallData || incomingCallData.callId !== cId)) {

                callId: cId,
                callerUid: cData.callerUid,
                offer: cData.offer
              };
              const callerName = getUserDisplayNameByUid(cData.callerUid);
              const u = allUsersByUid[cData.callerUid];
              showIncomingCallModal(callerName, u && u.email ? u.email : "");
            }
          } else if (incomingCallData && incomingCallData.callId === cId) {
            incomingCallData = null;
            hideIncomingCallModal();
          }
        });
      });
    }

    // --- Chat & Room Functions ---
    async function markChatAsRead(roomKey, upToTs) {
      if (!currentUser || !roomKey) return;
      const maxTs = Math.max(Date.now(), Number(upToTs) || 0, Number(latestMsgTsMap[roomKey]) || 0);
      readStateMap[roomKey] = maxTs;
      unreadCounts[roomKey] = 0;
      renderGroupList();
      renderFriendList();
      updatePageTitle();
      try {
        await set(ref(db, "readState/" + currentUser.uid + "/" + roomKey), maxTs);
      } catch (err) {
        console.error("readState 저장 실패:", err);
      }
    }

    function updatePageTitle() {
      const total = Object.values(unreadCounts).reduce((acc, n) => acc + (n || 0), 0);
      document.title = total > 0 ? `(${total}) 프라이빗 메신저` : "프라이빗 메신저 (1:1 · 단체톡 · 보이스톡)";
    }

    function getActiveRoomKey() {
      if (!currentUser || !activeRoom) return null;
      if (activeRoom.type === "dm" && activeRoom.friend && activeRoom.friend.uid) {
        return getPrivateChatId(currentUser.uid, activeRoom.friend.uid);
      }
      if (activeRoom.type === "group" && activeRoom.groupId) {
        return getGroupChatId(activeRoom.groupId);
      }
      return null;
    }

    function syncRoomWatchers() {
      if (!currentUser) return;
      const desiredRooms = new Map();

      Object.values(friendsMap).forEach((f) => {
        const info = allUsersMap[normEmail(f.email)];
        if (info && info.uid) {
          const rKey = getPrivateChatId(currentUser.uid, info.uid);
          desiredRooms.set(rKey, {
            dbPath: "chats/" + rKey + "/messages",
            type: "dm",
            friendEmail: normEmail(f.email)
          });
        }
      });

      getVisibleGroupIds().forEach((gId) => {
        const rKey = getGroupChatId(gId);
        desiredRooms.set(rKey, {
          dbPath: "groupMessages/" + gId + "/messages",
          type: "group",
          groupId: gId
        });
      });

      Object.keys(roomWatchers).forEach((rKey) => {
        if (!desiredRooms.has(rKey)) {
          off(roomWatchers[rKey]);
          delete roomWatchers[rKey];
          delete unreadCounts[rKey];
          delete latestMsgTsMap[rKey];
        }
      });

      desiredRooms.forEach((meta, rKey) => {
        if (roomWatchers[rKey]) return;
        const cRef = ref(db, meta.dbPath);
        roomWatchers[rKey] = cRef;

        // 3개월(90일) 경과 오래된 데이터 정리
        pruneOldMessagesAtPath(meta.dbPath);

        onValue(cRef, (snap) => {
          const msgsObj = snap.val() || {};
          const entries = Object.entries(msgsObj);
          const maxCreatedAt = entries.reduce((mx, [, m]) => Math.max(mx, Number(m && m.createdAt) || 0), 0);
          latestMsgTsMap[rKey] = maxCreatedAt;

          const lastRead = Number(readStateMap[rKey]) || 0;
          const isCurrentRoomOpen = getActiveRoomKey() === rKey && document.hasFocus();

          if (isCurrentRoomOpen) {
            unreadCounts[rKey] = 0;
            const latestEntry = entries[entries.length - 1];
            if (latestEntry) lastNotifiedMsgId[rKey] = latestEntry[0];
            markChatAsRead(rKey, maxCreatedAt);
            return;
          }

          let count = 0;
          entries.forEach(([, m]) => {
            if (!m) return;
            if (m.senderUid !== currentUser.uid && (Number(m.createdAt) || 0) > lastRead) {
              count += 1;
            }
          });
          unreadCounts[rKey] = count;

          const latestEntry = entries[entries.length - 1];
          if (latestEntry) {
            const [latestId, latestMsg] = latestEntry;
            if (
              latestMsg &&
              latestMsg.senderUid !== currentUser.uid &&
              (Number(latestMsg.createdAt) || 0) > lastRead &&
              lastNotifiedMsgId[rKey] !== latestId
            ) {
              lastNotifiedMsgId[rKey] = latestId;
              const senderLabel = getSenderDisplayName(latestMsg);
              if (meta.type === "group") {
                const gTitle = (allGroupChatsMap[meta.groupId] && allGroupChatsMap[meta.groupId].title) || "단체톡";
                showDesktopNotification(`${gTitle} · ${senderLabel}`, latestMsg.text || "새 메시지가 도착했습니다.");
              } else {
                showDesktopNotification(senderLabel, latestMsg.text || "새 메시지가 도착했습니다.");
              }
            }
          }

          renderGroupList();
          renderFriendList();
          updatePageTitle();
        });
      });
    }

        appShell.classList.add("active");
        myEmailLabel.textContent = user.email;
        requestNotificationPermission();

        const myUserRef = ref(db, "users/" + user.uid);
        const connectedRef = ref(db, ".info/connected");

        onValue(connectedRef, async (snap) => {
          if (snap.val() === true) {
            await onDisconnect(myUserRef).set({
              uid: user.uid,
              email: normEmail(user.email),
              online: false,
              lastSeen: serverTimestamp()
            });
            await set(myUserRef, {

              email: normEmail(user.email),
              online: true,
              lastSeen: Date.now()
            });

        });

        onValue(ref(db, "readState/" + user.uid), (snap) => {

        onValue(ref(db, "users"), (snap) => {

          Object.values(val).forEach((u) => {
            if (u && u.email) {
              allUsersMap[normEmail(u.email)] = u;
            }
            if (u && u.uid) {
              allUsersByUid[u.uid] = u;

          });
          renderGroupMemberPicker();
          syncRoomWatchers();
          syncIncomingCallWatchers();
          renderGroupList();
          renderFriendList();
          updateActiveRoomHeader();
          updateVoiceCallButtonState();
          if (activeRoom && activeRoom.type === "dm" && activeRoom.friend && !activeRoom.friend.uid) {

            if (matched && matched.uid) {
              openChatWithFriend({ name: activeRoom.friend.name, email: activeRoom.friend.email });
            }
          }
        });

        onValue(ref(db, "friends/" + user.uid), (snap) => {
          friendsMap = snap.val() || {};
          renderGroupMemberPicker();
          syncRoomWatchers();
          syncIncomingCallWatchers();
          renderFriendList();
        });

        onValue(ref(db, "userGroups/" + user.uid), (snap) => {
          myGroupIdsMap = snap.val() || {};
          syncRoomWatchers();
          renderGroupList();
        });

        onValue(ref(db, "groupChats"), (snap) => {
          allGroupChatsMap = snap.val() || {};
          syncRoomWatchers();
          renderGroupList();
          updateActiveRoomHeader();
        });
      } else {
        cleanupCallLocal(false);
        currentUser = null;
        activeRoom = null;
        myGroupIdsMap = {};
        allGroupChatsMap = {};
        cleanedPathsSet.clear();
        if (activeChatRef) {
          off(activeChatRef);
          activeChatRef = null;
        }
        Object.values(roomWatchers).forEach((r) => off(r));
        roomWatchers = {};
        Object.values(incomingCallWatchers).forEach((r) => off(r));
        incomingCallWatchers = {};
        unreadCounts = {};
        latestMsgTsMap = {};
        updatePageTitle();
        appShell.classList.remove("active");
        loginBox.style.display = "block";
        setChatInputEnabled(false);
        updateVoiceCallButtonState();
      }

    createGroupBtn.addEventListener("click", async () => {
      if (!currentUser) return;
      const title = groupTitleInput.value.trim();

      const invitedUids = checkedBoxes.map((cb) => cb.value).filter(Boolean);

        alert("단체톡 방 이름을 입력하세요.");
        return;
      }
      if (invitedUids.length < 1) {
        alert("단체톡에 초대할 친구를 1명 이상 선택하세요.");
        return;
      }

      const memberUidsSet = new Set([currentUser.uid, ...invitedUids]);
      const membersObj = {};
      memberUidsSet.forEach((uid) => {
        membersObj[uid] = true;
      });

      createGroupBtn.disabled = true;
      try {
        const newGroupRef = push(ref(db, "groupChats"));
        const groupId = newGroupRef.key;
        if (!groupId) {
          throw new Error("단체톡 방 ID를 생성하지 못했습니다.");
        }

        const groupPayload = {
          groupId,
          title,
          createdBy: currentUser.uid,
          createdAt: Date.now(),
          members: membersObj
        };

        await set(newGroupRef, groupPayload);
        await set(ref(db, "userGroups/" + currentUser.uid + "/" + groupId), true);

        myGroupIdsMap[groupId] = true;

        checkedBoxes.forEach((cb) => { cb.checked = false; });

        openGroupChat(groupId);

        alert("단체톡 방 생성에 실패했습니다.\nFirebase Realtime Database 규칙에 groupChats, userGroups가 추가되어 있는지 확인해 주세요.\n오류: " + (err && err.message ? err.message : err));

        const isSelected = activeRoom && activeRoom.type === "dm" && activeRoom.friend && normEmail(activeRoom.friend.email) === fEmail;

        const item = document.createElement("div");
        item.className = "friend-item" + (isSelected ? " selected" : "");

        const nameDiv = document.createElement("div");
        const nameEl = document.createElement("div");
        nameEl.className = "friend-name";
        nameEl.textContent = f.name;

        const subEl = document.createElement("div");
        subEl.className = "friend-sub";
        subEl.textContent = fEmail;

        nameDiv.appendChild(nameEl);
        nameDiv.appendChild(subEl);

        const rightDiv = document.createElement("div");
        rightDiv.className = "friend-right";

        if (unread > 0) {
          const unreadEl = document.createElement("span");
          unreadEl.className = "unread-badge";
          unreadEl.textContent = unread > 99 ? "99+" : String(unread);
          rightDiv.appendChild(unreadEl);
        }

        const badge = document.createElement("span");
        badge.className = "presence-badge " + (isOnline ? "online" : "offline");
        badge.textContent = isOnline ? "접속 중" : "오프라인";
        rightDiv.appendChild(badge);

        item.appendChild(nameDiv);
        item.appendChild(rightDiv);

        item.addEventListener("click", () => {
          openChatWithFriend({ name: f.name, email: fEmail });
        });

        friendListEl.appendChild(item);
      });
    }

    function updateActiveRoomHeader() {
      if (!activeRoom) return;
      if (activeRoom.type === "dm" && activeRoom.friend) {
        const info = allUsersMap[normEmail(activeRoom.friend.email)];
        const isOnline = Boolean(info && info.online);
        chatTitle.textContent = activeRoom.friend.name;
        chatSubtitle.textContent = isOnline
          ? "● 현재 접속 중 (1:1 채팅 · 보이스톡 가능)"
          : (info && typeof info.lastSeen === "number" ? "오프라인 · 최근 접속 " + formatTime(info.lastSeen) : "오프라인 (1:1 채팅)");
      } else if (activeRoom.type === "group" && activeRoom.groupId) {
        const meta = allGroupChatsMap[activeRoom.groupId] || {};
        const memberUids = meta.members ? Object.keys(meta.members) : [];
        const names = memberUids.map((uid) => getUserDisplayNameByUid(uid));
        chatTitle.textContent = meta.title || "단체톡방";
        chatSubtitle.textContent = names.length > 0 ? `참여자 (${names.length}명): ${names.join(", ")}` : "단체 채팅방";
      }
    }

    async function deleteOwnMessage(dbPath, msgId, messageData) {
      if (!currentUser || !dbPath || !msgId || !messageData) return;
      if (messageData.senderUid !== currentUser.uid) {
        alert("본인이 보낸 메시지만 삭제할 수 있습니다.");
        return;
      }
      if (!confirm("이 메시지를 삭제하시겠습니까?")) return;

      try {
        await remove(ref(db, dbPath + "/" + msgId));
      } catch (err) {
        console.error("메시지 삭제 실패:", err);
        alert("메시지 삭제 중 오류가 발생했습니다.");
      }
    }

    function attachMessageListener(dbPath, roomKey, emptyText, isGroup) {
      if (activeChatRef) {
        off(activeChatRef);
        activeChatRef = null;
      }

      pruneOldMessagesAtPath(dbPath);
      markChatAsRead(roomKey, latestMsgTsMap[roomKey]);
      activeChatRef = ref(db, dbPath);

      onValue(activeChatRef, (snap) => {
        messagesBox.innerHTML = "";
        const msgs = snap.val() || {};
        const entries = Object.entries(msgs);
        const maxCreatedAt = entries.reduce((mx, [, m]) => Math.max(mx, Number(m && m.createdAt) || 0), 0);
        latestMsgTsMap[roomKey] = maxCreatedAt;

        if (entries.length === 0) {
          messagesBox.innerHTML = `<div class="empty-chat">${emptyText}</div>`;
          return;
        }

        entries.forEach(([msgId, m]) => {
          if (!m) return;

          // 통화 이력 시스템 메시지 렌더링
          if (m.type === "call_log") {
            const sysRow = document.createElement("div");
            sysRow.className = "system-msg-row";
            const textSpan = document.createElement("span");
            textSpan.textContent = m.text;
            const timeSpan = document.createElement("span");
            timeSpan.className = "system-msg-time";
            timeSpan.textContent = formatTime(m.createdAt);
            sysRow.appendChild(textSpan);
            sysRow.appendChild(timeSpan);
            messagesBox.appendChild(sysRow);
            return;
          }

          const isMine = m.senderUid === currentUser.uid;
          const row = document.createElement("div");
          row.className = "msg-row " + (isMine ? "mine" : "theirs");

          if (!isMine) {
            const senderEl = document.createElement("div");
            senderEl.className = "msg-sender";
            senderEl.textContent = isGroup
              ? getSenderDisplayName(m)
              : ((activeRoom && activeRoom.friend && activeRoom.friend.name) || getSenderDisplayName(m));
            row.appendChild(senderEl);
          }

          const wrap = document.createElement("div");
          wrap.className = "msg-bubble-wrap";

          const bubble = document.createElement("div");
          bubble.className = "msg-bubble";
          bubble.textContent = m.text;

          const metaEl = document.createElement("div");
          metaEl.className = "msg-meta";

          if (isMine) {
            const delBtn = document.createElement("button");
            delBtn.type = "button";
            delBtn.className = "msg-delete-btn";
            delBtn.textContent = "삭제";
            delBtn.title = "내가 보낸 메시지 삭제";
            delBtn.addEventListener("click", () => deleteOwnMessage(dbPath, msgId, m));
            metaEl.appendChild(delBtn);
          }

          const timeEl = document.createElement("div");
          timeEl.className = "msg-time";
          timeEl.textContent = formatTime(m.createdAt);
          metaEl.appendChild(timeEl);

          wrap.appendChild(bubble);
          wrap.appendChild(metaEl);
          row.appendChild(wrap);
          messagesBox.appendChild(row);
        });

        messagesBox.scrollTop = messagesBox.scrollHeight;
        if (document.hasFocus()) {
          markChatAsRead(roomKey, maxCreatedAt);
        }
      });
    }

    function openChatWithFriend(friend) {
      if (!currentUser) return;
      const fEmail = normEmail(friend.email);
      const info = allUsersMap[fEmail];
      activeRoom = {
        type: "dm",
        friend: {
          name: friend.name,
          email: fEmail,
          uid: info ? info.uid : null
        }
      };

      renderGroupList();
      renderFriendList();
      updateActiveRoomHeader();
      updateVoiceCallButtonState();

      if (activeChatRef) {
        off(activeChatRef);
        activeChatRef = null;
      }

      if (!activeRoom.friend.uid) {
        messagesBox.innerHTML = '<div class="empty-chat">친구가 아직 한 번도 로그인하지 않아 UID를 불러올 수 없습니다.<br/>친구가 먼저 로그인한 뒤 다시 클릭해 주세요.</div>';
        setChatInputEnabled(false);
        return;
      }

      setChatInputEnabled(true);

      const chatId = getPrivateChatId(currentUser.uid, activeRoom.friend.uid);
      attachMessageListener(
        "chats/" + chatId + "/messages",
        chatId,
        "1:1 대화방이 열렸습니다. 첫 메시지를 보내보세요!",
        false
      );
    }

    function openGroupChat(groupId) {
      if (!currentUser || !groupId) return;
      activeRoom = {
        type: "group",
        groupId
      };

      renderGroupList();
      renderFriendList();
      updateActiveRoomHeader();
      updateVoiceCallButtonState();

      setChatInputEnabled(true);

      const roomKey = getGroupChatId(groupId);
      attachMessageListener(
        "groupMessages/" + groupId + "/messages",
        roomKey,
        "단체톡방이 열렸습니다. 참여자들과 첫 메시지를 나눠보세요!",
        true
      );
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!currentUser || !activeRoom) return;
      const text = messageInput.value.trim();
      if (!text) return;

      const nowTs = Date.now();
      const payload = {
        senderUid: currentUser.uid,
        senderEmail: normEmail(currentUser.email),
        text,
        createdAt: nowTs
      };

      if (activeRoom.type === "dm" && activeRoom.friend && activeRoom.friend.uid) {
        const chatId = getPrivateChatId(currentUser.uid, activeRoom.friend.uid);
        await push(ref(db, "chats/" + chatId + "/messages"), payload);
        await markChatAsRead(chatId, nowTs);
      } else if (activeRoom.type === "group" && activeRoom.groupId) {
        const roomKey = getGroupChatId(activeRoom.groupId);
        await push(ref(db, "groupMessages/" + activeRoom.groupId + "/messages"), payload);
        await markChatAsRead(roomKey, nowTs);
      }

      emojiPickerPanel.classList.remove("open");
      messageInput.value = "";
      messageInput.focus();
    });
  </script>
</body>
</html>
